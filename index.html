<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">

    <header class="cabecera">
      <h1>Diario de Estudio</h1>
    </header>

    <section class="tarjeta racha">
      <div class="racha-actual">
        <span class="racha-icono">🔥</span>
        <p class="racha-valor" id="racha">0</p>
        <p class="racha-texto" id="racha-texto">días seguidos estudiando</p>
      </div>
      <div class="racha-mejor">
        <p class="racha-mejor-valor" id="mejor-racha">0</p>
        <p class="racha-texto">Mejor racha</p>
      </div>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" placeholder="Ej: JavaScript" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" min="1" step="1" placeholder="Ej: 45" required>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Sesiones</h2>
      <p class="vacio" id="vacio" hidden>Todavía no has registrado ninguna sesión.</p>
      <ul class="lista" id="lista"></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
